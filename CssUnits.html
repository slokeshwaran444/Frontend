<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Css Units</title>
    <style>
.px{
    background-color: beige;
    height: 10px;
    width: 10px;
}
.cm{
background-color: bisque;
height: 2cm;
width: 2cm;
}
.mm{
    background-color: blanchedalmond;
    height: 20mm;
    width: 20mm;
}
.inch{
    background-color: blue;
    height: 2in;
    width: 2in;
}
.percentage{
    background-color: blueviolet;
    height: 100%;
    width: 100%;
}
    </style>
    <\<head>
        <body>
            <p>absolute unit</p>
            <p class="px">px</p>
            <p class="cm">cm</p>
            <p class="mm">mm</p>
            <p class="inch">inch</p>
            <p>relative units</p>
            <p class="percentage">percentage</p>
        </body>
