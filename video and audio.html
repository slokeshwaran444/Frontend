<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image video Audio Practice</title>
</head>
<body>
    <a href="https://youtube.com/">
    <img src="image/photo 1.png" alt="Image not found" width="500" height="500" type="Images/jpg">
    </a>
    <video width="320px" height="240px" controls autoplay muted loop>
        <source src="video/video 1.mp4" type="video/mp4">
    </video>
    <audio controls width="320" height="240" unmuted loop>
<source src="audio/audio 1.mp3" type="audio/mpeg">
    </audio>
</body>
    </html>
